## Gloabl plugin configuration. #DO NOT MODIFY
plugins:
  azure_devops:
    # Azure DevOps Plugin Configuration
    name: CumulusCI Plus Azure DevOps
    description: Plugin for Azure DevOps integration
    author: Rupesh J

    # Plugin specific configuration
    config:
      # Azure DevOps specific configuration
      api_version: "7.0"
      completion_opts_delete_source_branch: False
      completion_opts_merge_strategy: noFastForward # squash, rebase, rebaseMerge
      completion_opts_bypass_policy: False
      completion_opts_bypass_reason: Automated bypass for CI/CD pipeline
      organisation_artifact: False # When True artifacts are created at Organisation level otherwise, its project level.
      feed_name: SFCore Packages # Default feed name for salesforce packages
      artifact_folder_path: # Artifact folder in repo to upload for salesforce packages
      pull_request_approve_on_merge: True # When True, the created pull request is approved on merge.
      release_notes_path: release-notes/{tag}.md # Markdown path written by vcs_release_notes. {tag} is replaced with the release tag. A value without {tag} is treated as a directory.
      release_notes_publish: pull_request # file writes locally; pull_request opens an automerge PR on this repo; repository pushes to release_notes_repository. A YAML list or comma-separated string runs each in order.
      release_notes_repository: # ADO repo URL used when release_notes_publish includes repository
      release_notes_branch: # Branch on release_notes_repository. Defaults to that repo's default branch.
services:
  azure_devops:
    description: Configure connection for Azure DevOps Server
    attributes:
      username:
        description: The GitHub Enterprise username to use for tasks.
        required: True
      email:
        description: The email address to used by GitHub tasks when an operation requires an email address.
        required: True
      url:
        description: "Azure DevOps organization url (Example: dev.azure.com/YOURORG)."
        required: True
      token:
        description: Personal Access Token
        required: True
        sensitive: True
project:
  git:
    release_notes:
      parsers:
        azure_devops:
          1:
            class_path: cumulusci_ado.vcs.ado.release_notes.parser.ADOLinesParser
            title: Critical Changes
          2:
            class_path: cumulusci_ado.vcs.ado.release_notes.parser.ADOLinesParser
            title: Changes
          3:
            class_path: cumulusci_ado.vcs.ado.release_notes.parser.ADOLinesParser
            title: Issues Closed
